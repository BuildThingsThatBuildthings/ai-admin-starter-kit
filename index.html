<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starter Kit for Treatment Court Teams</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #fff; color: #000; }
      body { font-family: Arial, Helvetica, sans-serif; }
      main {
        width: min(100%, 8.5in);
        min-height: 11in;
        margin: 0 auto;
        padding: 0.85in 0.7in;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75in;
      }
      h1 {
        margin: 0;
        max-width: 7.1in;
        text-align: center;
        font-size: clamp(2.3rem, 7vw, 4.5rem);
        line-height: 1.02;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      img { width: min(6in, 82vw); height: auto; image-rendering: pixelated; }
      @page { size: letter; margin: 0; }
      @media print {
        main { width: 8.5in; height: 11in; min-height: 0; }
        h1 { font-size: 0.62in; }
        img { width: 6in; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Starter Kit for Treatment Court Teams</h1>
      <img src="./stripe-payment-qr.png" alt="QR code to purchase the starter kit" />
    </main>
  </body>
</html>
